<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Password - StudyCalc</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f6fa;font-family:Arial,sans-serif}.card{width:min(420px,92%);background:#fff;padding:32px;border-radius:16px;box-shadow:0 10px 30px #0001}h1{text-align:center}p{color:#68737d;line-height:1.5}input{width:100%;padding:13px;border:1px solid #ccd3da;border-radius:9px;font-size:15px}button{width:100%;margin-top:18px;padding:13px;border:0;border-radius:9px;background:#1769e0;color:#fff;font-weight:700}.message{margin-top:15px;padding:10px;border-radius:8px;display:none}.error{display:block;background:#fff0f0;color:#b42318}.success{display:block;background:#effbf2;color:#18743b}.back{text-align:center;margin-top:18px}.back a{color:#1769e0}</style></head><body><div class="card"><h1>Reset Password</h1><p>Enter your registered email. Firebase will send a secure password-reset link.</p><form id="resetForm"><input id="email" type="email" placeholder="Email address" required autocomplete="email"><button>Send Reset Email</button></form><div id="message" class="message"></div><div class="back"><a href="login.html">← Back to Login</a></div></div><script type="module">import "./auth.js";const f=document.getElementById("resetForm"),m=document.getElementById("message");f.addEventListener("submit",async e=>{e.preventDefault();try{await Auth.resetPassword(document.getElementById("email").value.trim());m.className="message success";m.textContent="If this email is registered, a password-reset email has been sent.";}catch(err){m.className="message error";m.textContent=Auth.friendlyError(err);}});</script></body></html>
