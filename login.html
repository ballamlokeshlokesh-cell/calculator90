<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - StudyCalc</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f6fa;font-family:Arial,sans-serif;color:#17202a}.card{width:min(420px,92%);background:#fff;padding:32px;border-radius:16px;box-shadow:0 10px 30px #0001}h1{text-align:center;margin:0 0 8px}.sub{text-align:center;color:#68737d;margin-bottom:25px}label{display:block;font-weight:600;margin:14px 0 7px}input{width:100%;padding:13px;border:1px solid #ccd3da;border-radius:9px;font-size:15px}button{width:100%;margin-top:20px;padding:13px;border:0;border-radius:9px;background:#1769e0;color:#fff;font-weight:700;cursor:pointer}.links{text-align:center;margin-top:18px}.links a{color:#1769e0;text-decoration:none}.message{margin-top:15px;padding:10px;border-radius:8px;display:none}.error{display:block;background:#fff0f0;color:#b42318}.success{display:block;background:#effbf2;color:#18743b}
</style>
</head>
<body>
<div class="card">
<h1>StudyCalc Login</h1><p class="sub">Login to access your calculator dashboard</p>
<form id="loginForm">
<label for="email">Email</label><input id="email" type="email" required autocomplete="email">
<label for="password">Password</label><input id="password" type="password" required autocomplete="current-password">
<button type="submit">Login</button>
</form>
<div id="message" class="message"></div>
<div class="links"><a href="signup.html">Create account</a> · <a href="forgot-password.html">Forgot password?</a></div>
</div>
<script type="module">
import "./auth.js";
const form=document.getElementById("loginForm"), msg=document.getElementById("message");
form.addEventListener("submit",async e=>{e.preventDefault();msg.className="message";msg.textContent="";
try{const user=await Auth.loginUser(document.getElementById("email").value.trim(),document.getElementById("password").value);
if(!user.emailVerified){msg.className="message error";msg.textContent="Please verify your email first. Check your inbox.";return;}
msg.className="message success";msg.textContent="Login successful. Opening StudyCalc...";setTimeout(()=>location.href="calculator.html",500);
}catch(err){msg.className="message error";msg.textContent=Auth.friendlyError(err);}
});
</script>
</body></html>
